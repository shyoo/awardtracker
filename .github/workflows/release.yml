name: Release

# /release pushes an annotated vMAJOR.MINOR.PATCH[-rc.N] tag. RC tags become
# prereleases; a final tag on the verified RC commit becomes /releases/latest.
# Every downloadable file is built here, never on a maintainer's machine.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate tag and release notes
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N"
            exit 1
          fi
          # actions/checkout replaces the annotated tag with a lightweight one
          # pointing at the commit; re-fetch the real tag object from origin.
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::$TAG is lightweight; /release must create an annotated tag containing the notes."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$TAG^{commit}" origin/main; then
            echo "::error::$TAG does not point to a commit on origin/main."
            exit 1
          fi
          python scripts/release_tag.py validate "$TAG"
          git tag -l --format='%(contents:body)' "$TAG" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::$TAG has no release notes in its annotated tag message."
            exit 1
          fi

          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: pytest (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest "setuptools<81"
      - name: Run tests
        run: pytest -q

  build-windows:
    name: Build Windows x64
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Materialize tag version
        shell: pwsh
        run: Set-Content -LiteralPath version.txt -Value '${{ needs.prepare.outputs.version }}' -NoNewline

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build portable ZIP and setup installer
        shell: pwsh
        env:
          AT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./release-win.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/awardtracker-win64-portable-*.zip
            dist/awardtracker-win64-setup-*.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Materialize tag version
        shell: bash
        run: printf '%s\n' '${{ needs.prepare.outputs.version }}' > version.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 and MACOS_CERTIFICATE_PASSWORD secrets are required."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(python -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning -v "$KEYCHAIN"

      - name: Build, sign, and notarize
        env:
          AT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          AT_ASSET_ARCH: ${{ matrix.arch }}
          AT_ASSUME_YES: '1'
          AT_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          AT_NOTARY_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AT_NOTARY_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in AT_SIGN_IDENTITY AT_NOTARY_KEY_ID AT_NOTARY_ISSUER_ID AC_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::MACOS_SIGNING_IDENTITY, AC_API_KEY_ID, AC_API_ISSUER_ID and AC_API_KEY_P8 secrets are required."
              exit 1
            fi
          done
          export AT_NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          # Accept the key either as raw PEM text or base64-encoded.
          if [[ "$AC_API_KEY_P8" == *"-----BEGIN"* ]]; then
            printf '%s\n' "$AC_API_KEY_P8" > "$AT_NOTARY_KEY_PATH"
          else
            echo "$AC_API_KEY_P8" | base64 --decode > "$AT_NOTARY_KEY_PATH"
          fi
          chmod 600 "$AT_NOTARY_KEY_PATH"
          chmod +x release-macos.sh build-macos.sh
          ./release-macos.sh --codesign

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/awardtracker-macos-${{ matrix.arch }}-portable-*.zip
            dist/awardtracker-macos-${{ matrix.arch }}-setup-*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.prepare.outputs.prerelease == 'true' && 'prerelease' || 'latest release' }}
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage assets, notes, and checksums
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir staging
          # Keep Intel first for update clients older than the architecture-aware selector.
          cp artifacts/windows-x64/* staging/
          cp artifacts/macos-x86_64/* staging/
          cp artifacts/macos-arm64/* staging/
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:body)' "$TAG" > release-notes.md
          (cd staging && sha256sum * > SHA256SUMS.txt)
          cat staging/SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          # Keep x86_64 before arm64 for updater versions that select the first
          # macOS asset and do not yet understand architecture tags.
          gh release create "$TAG" \
            staging/awardtracker-win64-* \
            staging/awardtracker-macos-x86_64-* \
            staging/awardtracker-macos-arm64-* \
            staging/SHA256SUMS.txt \
            --verify-tag \
            --title "Award Tracker $TAG" \
            --notes-file release-notes.md \
            "${flags[@]}"

          if [ "$PRERELEASE" = true ]; then
            echo "### Prerelease $TAG published" >> "$GITHUB_STEP_SUMMARY"
            echo "Install and verify it, then run /release promote." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Latest release $TAG published" >> "$GITHUB_STEP_SUMMARY"
            echo "Existing installations can now discover it through /releases/latest." >> "$GITHUB_STEP_SUMMARY"
          fi
