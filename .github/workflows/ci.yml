name: CI

# Backstop for the /push skill, which runs the same suite locally before
# pushing. Runs on every branch and PR so a regression cannot hide on a branch.
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-html 2.0.1 (via seleniumbase) imports pkg_resources, which
          # setuptools dropped in 81. Pin until seleniumbase is upgraded.
          pip install pytest "setuptools<81"

      - name: Run tests
        run: pytest -q
