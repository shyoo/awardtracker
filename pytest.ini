[pytest]
# Collect only the real suite. Without this, a bare `pytest -q` from the repo
# root also picks up ad-hoc `test_*.py` scripts under scratch/ — they are
# gitignored, so they exist in developer checkouts but not in fresh worktrees,
# and several of them fail at import (missing local HTML fixtures, SystemExit,
# syntax errors). That made the checks pass in CI and fail on a dev machine.
testpaths = tests

# Belt and braces: keep collection out of build output and local-only dirs even
# when a path is passed explicitly.
norecursedirs =
    scratch
    build
    dist
    venv
    venv-universal
    browser_profiles
    downloaded_files
    internal_docs
    profiles
    backups
    mock_profile_path
    .git
